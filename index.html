<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat</title>

<style>
body {
  font-family: sans-serif;
  max-width: 700px;
  margin: auto;
  padding: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  box-sizing: border-box;
}

#chat {
  height: 60vh;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
}

.msg {
  margin: 8px 0;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>AI Chat</h2>

<input id="base" placeholder="Base URL (https://ai-us.hctopup.com/v1)">
<input id="key" placeholder="API Key">
<input id="model" placeholder="model (claude-opus-4-7)">

<div id="chat"></div>

<input id="input" placeholder="输入消息">
<button onclick="send()">发送</button>

<script>

const base = document.getElementById("base");
const key = document.getElementById("key");
const model = document.getElementById("model");
const input = document.getElementById("input");

let messages = [];

/* =========================
   自动保存
========================= /

function saveAll() {
  localStorage.setItem("messages", JSON.stringify(messages));
  localStorage.setItem("base", base.value);
  localStorage.setItem("key", key.value);
  localStorage.setItem("model", model.value);
}

function loadAll() {

  const savedMessages = localStorage.getItem("messages");

  if (savedMessages) {
    try {
      messages = JSON.parse(savedMessages);
    } catch(e) {
      messages = [];
    }
  }

  base.value = localStorage.getItem("base") || "";
  key.value = localStorage.getItem("key") || "";
  model.value = localStorage.getItem("model") || "";
}

/ 配置变化自动保存 /

base.oninput = saveAll;
key.oninput = saveAll;
model.oninput = saveAll;

/ =========================
   渲染
========================= /

function render() {

  let c = document.getElementById("chat");
  c.innerHTML = "";

  messages.forEach(m => {

    let div = document.createElement("div");

    div.className = "msg";

    div.innerText =
      (m.role === "user" ? "你: " : "AI: ")
      + m.content;

    c.appendChild(div);
  });

  c.scrollTop = c.scrollHeight;

  saveAll();
}

/ =========================
   发送
========================= /

async function send() {

  let text = input.value.trim();
  if (!text) return;

  input.value = "";

  messages.push({ role: "user", content: text });
  render();

  // ⭐ 关键：Supabase失败不影响聊天
  try {
    await supabase.from("messages").insert({
      role: "user",
      content: text
    });
  } catch (e) {
    console.log("supabase failed:", e);
  }

  let baseUrl = base.value.trim().replace(/\/$/, "");

  try {

    let res = await fetch(baseUrl + "/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key.value
      },
      body: JSON.stringify({
        model: model.value,
        messages
      })
    });

    let data = await res.json();

    let reply =
      data?.choices?.[0]?.message?.content
      || JSON.stringify(data);

    messages.push({ role: "assistant", content: reply });
    render();

    // ⭐ 可选保存
    try {
      await supabase.from("messages").insert({
        role: "assistant",
        content: reply
      });
    } catch (e) {}

  } catch (err) {

    messages.push({
      role: "assistant",
      content: "请求失败：" + err.message
    });

    render();
  }
}

/ =========================
   初始化
========================= */

loadAll();
render();

</script>

</body>
</html>
